        Each one starts with no cache, so routing it is free. Explore ran on <b>Sonnet</b>; the general-purpose agents on Opus, then Sonnet.

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const CH = 25 * 0.6; // JetBrains Mono advance at 25px
      const WIN = { x: 80, y: 60 };
      const Y_DYN = WIN.y + 168 + 20, Y_STATUS = WIN.y + 868 + 41, Y_AGENTS = WIN.y + 452 + 111;
      const EDGE = 1395;

      // reveal a typed span character by character; returns the time typing ends
      function type(sel, caretSel, at, cps, text) {
        const el = document.querySelector(sel);
        const n = (text || el.textContent).length;
        const dur = n / (cps || 28);
        if (text) tl.set(sel, { textContent: text }, at - 0.35);
        tl.set(caretSel, { opacity: 1 }, at - 0.3);
        tl.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "steps(" + n + ")" }, at);
        tl.fromTo(caretSel, { x: -n * CH }, { x: 0, duration: dur, ease: "steps(" + n + ")" }, at);
        tl.set(caretSel, { opacity: 0 }, at + dur + 0.25);
        return at + dur;
      }
      // the input caret blinks while Claude works, as it does in Claude Code
      function blink(caretSel, from, until) {
        const n = Math.max(0, Math.floor((until - from) / 1.0) - 1);
        tl.set(caretSel, { x: 0 }, from);
        tl.fromTo(caretSel, { opacity: 1 }, { opacity: 0, duration: 1.0, ease: "steps(1)", repeat: n }, from);
        tl.set(caretSel, { opacity: 0 }, until);
      }
      function line(id, at) {
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
      }
      function stream(id, at) {
        const words = document.querySelectorAll("#" + id + " .w");
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at);
        tl.fromTo(words, { opacity: 0.18 }, { opacity: 1, duration: 0.27, stagger: 0.075, ease: "power2.out" }, at + 0.05);
        return at + 0.05 + words.length * 0.075 + 0.27;
      }
      function status(id, at) {
        tl.fromTo("#" + id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, at);
      }
      function statusSwap(fromId, toId, at) {
        tl.to("#" + fromId, { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power3.in" }, at);
        status(toId, at + 0.16);
      }
      function callout(id, leadId, at, until, targetY) {
        const co = document.getElementById(id);
        const y1 = parseFloat(co.style.top) + 70;
        tl.fromTo("#" + id, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, at);
        tl.to("#" + id, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, until);
        const l = document.getElementById(leadId);
        l.setAttribute("x1", 1424); l.setAttribute("y1", y1); l.setAttribute("x2", EDGE); l.setAttribute("y2", targetY);
        const len = Math.hypot(1424 - EDGE, y1 - targetY);
        tl.fromTo("#" + leadId, { opacity: 1, strokeDasharray: len + 4, strokeDashoffset: len + 4 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at + 0.15);
        tl.to("#" + leadId, { opacity: 0, duration: 0.2, ease: "power3.in" }, until);
      }
      function highlight(id, at, until) {
        tl.fromTo("#" + id, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, at);
        tl.to("#" + id, { opacity: 0, duration: 0.2, ease: "power3.in" }, until);
      }

      // the window arrives
      tl.fromTo("#s-win", { opacity: 0, scale: 0.97, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);

      // $ legato
      line("l-cmd", 0.5);
      let t = type("#ty-cmd", "#ca-cmd", 0.7, 12);
      // Claude Code's header box
      ["l-b1", "l-b2", "l-b3", "l-b4", "l-b5"].forEach((id, i) => line(id, t + 0.6 + i * 0.05));
      tl.fromTo("#s-input", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.9);
      highlight("hi-dyn", t + 1.0, t + 6.6);
      callout("co-1", "ld-1", t + 1.1, t + 6.6, Y_DYN);
      blink("#ca-in", t + 1.0, t + 6.4);

      // Hi
      t = t + 6.8;
      let te = type("#ty-in", "#ca-in", t, 10, "Hi");
      tl.set("#ty-in", { clipPath: "inset(0 100% 0 0)" }, te + 0.45);
      line("l-u1", te + 0.45);
      stream("l-a1", te + 0.9);
      status("st-1", te + 1.0);
      highlight("hi-status", te + 1.1, te + 7.6);
      callout("co-2", "ld-2", te + 1.2, te + 7.6, Y_STATUS);
      blink("#ca-in", te + 0.5, te + 7.7);

      // the four-stage prompt
      t = te + 8.0;
      te = type("#ty-in", "#ca-in", t, 70, "Do this in four stages, using the agents I name. 1. Use an Explore agent to map index.html …");
      tl.set("#ty-in", { clipPath: "inset(0 100% 0 0)" }, te + 0.4);
      line("l-u2a", te + 0.4); line("l-u2b", te + 0.45); line("l-u2c", te + 0.5);
      statusSwap("st-1", "st-2", te + 0.9);
      highlight("hi-status", te + 1.0, te + 7.0);
      callout("co-3", "ld-3", te + 1.1, te + 7.0, Y_STATUS);
      // the agents run
      line("l-t1", te + 1.4); line("l-t1d", te + 3.2);
      line("l-t2", te + 3.4); line("l-t2d", te + 5.6);
      line("l-t3", te + 5.8); line("l-t3d", te + 6.9);
      statusSwap("st-2", "st-3", te + 7.1);
      highlight("hi-agents", te + 7.3, te + 14.8);
      callout("co-4", "ld-4", te + 7.4, te + 14.8, Y_AGENTS);
      blink("#ca-in", te + 0.5, te + 14.9);

      // the question
      t = te + 15.2;
      te = type("#ty-in", "#ca-in", t, 30, "what are the next steps here?");
      tl.set("#ty-in", { clipPath: "inset(0 100% 0 0)" }, te + 0.4);
      line("l-u3", te + 0.4);
      stream("l-a3", te + 0.8);
      statusSwap("st-3", "st-4", te + 0.9);
      highlight("hi-status", te + 1.0, te + 7.6);
      callout("co-5", "ld-5", te + 1.1, te + 7.6, Y_STATUS);
      blink("#ca-in", te + 0.5, te + 7.7);

      // leave
      tl.to("#s-win", { opacity: 0, filter: "blur(8px)", scale: 0.985, duration: 0.3, ease: "power3.in" }, 41.65);

      window.__timelines["session"] = tl;
    })();
  </script>
